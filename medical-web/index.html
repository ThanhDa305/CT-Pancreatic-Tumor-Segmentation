<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - Hệ Thống Y Khoa Phân Đoạn Tuyến Tuỵ Ảnh CT 3 Chiều</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div id="authContainer">
        <div class="auth-box" id="loginModule">
            <h2>Đăng Nhập Bác Sĩ</h2>
            <div class="form-group">
                <label>Mã Bác Sĩ (Tên đăng nhập)</label>
                <input type="text" id="logUsername" class="form-control" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Mật mã</label>
                <input type="password" id="logPassword" class="form-control">
            </div>
            <button class="btn-auth" id="btnLogin">Mở Cửa</button>
            <div class="auth-link">
                Bác sĩ mới chuyển công tác? <a id="linkToRegister">Đăng ký ngay</a>
            </div>
        </div>

        <div class="auth-box" id="registerModule" style="display: none;">
            <h2>Cấp Mới Thẻ Bác Sĩ</h2>
            <div class="form-group">
                <label>Mã Bác Sĩ</label>
                <input type="text" id="regUsername" class="form-control" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Mật mã</label>
                <input type="password" id="regPassword" class="form-control">
            </div>
            <div class="form-group">
                <label>Nhập lại mật mã</label>
                <input type="password" id="regConfirmPassword" class="form-control">
            </div>
            <button class="btn-auth" id="btnRegister">Tạo Hồ Sơ</button>
            <div class="auth-link">
                Đã có thẻ? <a id="linkToLogin">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
